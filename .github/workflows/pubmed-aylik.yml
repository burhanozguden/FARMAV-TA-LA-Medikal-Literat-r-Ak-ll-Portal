name: PubMed aylık güncelleme
on:
  schedule:
    - cron: "0 5 * * 1"   # her pazartesi 08:00 (Türkiye); bekleyen çeviriler haftalık tamamlanır
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Şifreleme kütüphanesini kur
        run: pip install cryptography
      - name: Şifreli veriyi aç
        env:
          YONETICI_SIFRE: ${{ secrets.YONETICI_SIFRE }}
          RAKIPLER_JSON: ${{ secrets.RAKIPLER_JSON }}
        run: python scripts/guvenlik.py ac
      - name: PubMed'den yayınları çek ve çevir
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python scripts/pubmed_guncelle.py
      - name: Veriyi şifrele ve kullanıcı girişini hazırla
        env:
          YONETICI_SIFRE: ${{ secrets.YONETICI_SIFRE }}
          KULLANICILAR: ${{ secrets.KULLANICILAR }}
          SERVIS_URL: ${{ secrets.SERVIS_URL }}
          SERVIS_ANAHTAR: ${{ secrets.SERVIS_ANAHTAR }}
          RAKIPLER_JSON: ${{ secrets.RAKIPLER_JSON }}
        run: python scripts/guvenlik.py kapat
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "pubmed-bot"
          git config user.email "pubmed-bot@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet || (git commit -m "Veri güncellemesi (şifreli)" && git push)
