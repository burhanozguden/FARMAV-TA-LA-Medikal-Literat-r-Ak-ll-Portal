name: PubMed aylık güncelleme
on:
  schedule:
    - cron: "0 5 * * 1"   # her pazartesi 08:00 (Türkiye); bekleyen çeviriler haftalık tamamlanır
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: PubMed'den yayınları çek ve çevir
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python scripts/pubmed_guncelle.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "pubmed-bot"
          git config user.email "pubmed-bot@users.noreply.github.com"
          git add data/yayinlar.json
          git diff --staged --quiet || (git commit -m "PubMed aylık güncelleme" && git push)
