name: PubMed Aylık Otomasyon ve Rakip Taraması

on:
  schedule:
    - cron: '0 6 1 * *' # Her ayın 1. günü saat 09:00 TSI'de otomatik çalışır
  workflow_dispatch: # İstediğiniz an manuel çalıştırmak için

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Kütüphaneleri Yükle
        run: pip install requests
        
      - name: Veri Çekme Betiğini Çalıştır
        run: python script.py
        
      - name: Güncellenen JSON Dosyasını Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aylık PubMed ve Rakip Klinik Veri Güncellemesi [skip ci]" && git push)