name: PubMed Aylık Otomasyon

on:
  schedule:
    - cron: '0 6 1 * *' # Her ayın 1. günü Türkiye saatiyle sabah 09:00'da çalışır
  workflow_dispatch: # İstediğin zaman manuel olarak tetikleyebilmen için

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests
        
      - name: Veri Çekme Betiğini Çalıştır
        run: python script.py
        
      - name: Güncellenen JSON Dosyasını GitHub'a Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik PubMed aylık veri güncellemesi [skip ci]" && git push)