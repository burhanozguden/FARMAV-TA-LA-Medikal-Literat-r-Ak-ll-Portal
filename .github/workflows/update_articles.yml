name: PubMed Günlük Otomasyon

on:
  schedule:
    - cron: '0 6 * * *' # Her gün UTC 06:00'da (Türkiye saatiyle 09:00)
  workflow_dispatch: # Manuel tetikleme için

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Kütüphaneleri Yükle
        run: pip install requests
        
      - name: Veri Çekme Betiğini Çalıştır
        run: python script.py
        
      - name: JSON Güncellemesini GitHub'a Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik PubMed veri güncellemesi" && git push)
