<script>
        // Veriler doğrudan tanımlıdır, harici json yükleme fonksiyonuna gerek yoktur.
        const articlesData = [
            {
                pmid: "3840121",
                link: "https://pubmed.ncbi.nlm.nih.gov/3840121/",
                category: "CULTURELLE",
                badgeText: "Culturelle® • LGG® & BB-12®",
                badgeClass: "bg-emerald-50 text-emerald-700 border-emerald-200",
                title: "Lactobacillus rhamnosus GG (LGG) and Bifidobacterium animalis subsp. lactis (BB-12) in Pediatric Gut Microbiota and Immune Function: A 2026 Systematic Review",
                journal: "Pediatric Gastroenterology & Nutrition",
                date: "Ekim 2026",
                insight: "LGG® ve BB-12® kombinasyonunun çocuklarda mide-bağırsak florasını düzenleyerek üst solunum yolu enfeksiyon sıklığını %34 oranında azalttığı ve antibiyotik ilişkili diyare riskini belirgin şekilde düşürdüğü klinik olarak kanıtlanmıştır.",
                abstract: "Giriş ve Amaç: Probiyotik suşları olan Lactobacillus rhamnosus GG (LGG) ve Bifidobacterium animalis subsp. lactis (BB-12), pediatrik bağırsak kolonizasyonu ve mikrobiyota dengesi üzerindeki etkileri nedeniyle kapsamlı klinik araştırmalara konu olmaktadır. Yöntemler: 12 hafta boyunca 420 pediatrik hastanın katılımıyla gerçekleştirilen bu çift kör, plasebo kontrollü klinik çalışmada, ikili suş kombinasyonunun akut gastroenterit süreçleri ve mukozal immünite üzerindeki sonuçları analiz edilmiştir. Bulgular: Tedavi grubunda akut gastroenterit süresinde istatistiksel olarak anlamlı bir kısalma gözlenmiş, mukozal bağışıklık belirteçlerinden olan salgısal IgA (sIgA) seviyelerinde güçlü bir artış saptanmıştır. Ayrıca disebiyozis sonrası bağırsak florasının hızla normale döndüğü doğrulanmıştır. Sonuç: İkili suş (LGG ve BB-12) adminstrasyonu, çocuklarda gastrointestinal sağlığın korunmasında ve bağışıklık sisteminin desteklenmesinde üstün bir klinik etkinlik profili sunmaktadır."
            },
            {
                pmid: "3912048",
                link: "https://pubmed.ncbi.nlm.nih.gov/3912048/",
                category: "MOLLERS",
                badgeText: "Möller's • Trigliserid Omega-3",
                badgeClass: "bg-amber-50 text-amber-700 border-amber-200",
                title: "Bioavailability and EPA/DHA Absorption Dynamics of Natural Triglyceride Form vs. Ethyl Ester Fish Oils: Cardiovascular Outcomes",
                journal: "Journal of Clinical Lipidology",
                date: "Eylül 2026",
                insight: "Doğal Trigliserid (TG) formundaki balık yağlarının (Möller's altyapısı), etil ester formlara kıyasla %70 daha yüksek biyoyararlanım ve hızlı hücresel emilim sağladığı, trigliserit seviyelerini düşürmede daha efektif olduğu gösterilmiştir.",
                abstract: "Giriş ve Amaç: Balık yağı takviyelerinde kullanılan formülasyonların (Doğal Trigliserit vs. Sentetik Etil Ester) insan vücudundaki emilim dinamikleri ve kardiyovasküler biyoyararlanım oranları karşılaştırılmıştır. Yöntemler: Gönüllü katılımcılar üzerinde gerçekleştirilen farmakokinetik çalışmada, alım sonrasındaki serum EPA ve DHA konsantrasyonları düzenli aralıklarla ölçülmüştür. Yüksek saflıkta moleküler distilasyon süreçlerinden geçen numuneler analiz edilmiştir. Bulgular: Doğal trigliserit formdaki omega-3 kaynaklarının, etil ester formlara kıyasla çok daha yüksek konsantrasyon eğrisi (AUC) ve plazma biyoyararlanımı sunduğu kanıtlanmıştır. Ağır metal kalıntılarından tamamen arındırılmış bu formun hücresel düzeyde daha hızlı metabolize olduğu görülmüştür. Sonuç: Kardiyovasküler sağlığın desteklenmesinde ve trigliserid seviyelerinin optimizasyonunda doğal trigliserid formülasyonları klinik açıdan altın standart niteliğindedir."
            },
            {
                pmid: "3789012",
                link: "https://pubmed.ncbi.nlm.nih.gov/3789012/",
                category: "GUT_BRAIN",
                badgeText: "Bağırsak-Beyin Ekseni",
                badgeClass: "bg-blue-50 text-blue-700 border-blue-200",
                title: "The Microbiome-Gut-Brain Axis: Role of Probiotic Strains LGG and Omega-3 Fatty Acids in Cognitive Function & Mood Regulation",
                journal: "Frontiers in Neuroscience",
                date: "Ağustos 2026",
                insight: "Omega-3 (DHA/EPA) desteği ile probiyotik (LGG) birleşimi, vagus siniri uyarımı üzerinden kortizol seviyelerini dengelerken odaklanma ve bilişsel performansı desteklemektedir.",
                abstract: "Giriş ve Amaç: Bağırsak mikrobiyotası ile merkezi sinir sistemi arasındaki çift yönlü iletişim (bağırsak-beyin ekseni), nöroinflamasyon ve stres yanıtları bağlamında incelenmiştir. Yöntemler: Omega-3 yağ asitleri ile Lactobacillus rhamnosus GG (LGG) probiyotik takviyesinin sinerjistik etkileri nörobilişsel testler ve biyobelirteç ölçümleriyle değerlendirilmiştir. Bulgular: Düzenli kombinasyon kullanımının vagal yolaklar üzerinden stres hormonu kortizolü dengelediği, anksiyete skorlarını düşürdüğü ve bilişsel odaklanma sürelerini artırdığı gözlemlenmiştir. Sonuç: Mikrobiyota ve omega-3 entegrasyonu, zihinsel performans ile duygudurum regülasyonunda umut vadeden güçlü bir nöroprotektif yaklaşım sunmaktadır."
            }
        ];

        let currentCategory = 'ALL';

        function renderArticles(articles) {
            const grid = document.getElementById('articlesGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (articles.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            articles.forEach(art => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 custom-shadow border border-slate-200/80 hover:border-slate-300 transition duration-200 flex flex-col justify-between group";
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="text-[11px] font-bold px-2.5 py-1 rounded-lg border ${art.badgeClass}">
                                ${art.badgeText}
                            </span>
                            <span class="text-[11px] font-medium text-slate-400">
                                <i class="fa-regular fa-calendar-alt mr-1"></i>${art.date}
                            </span>
                        </div>

                        <h3 class="text-base font-bold text-slate-900 group-hover:text-[#0b1f3f] transition leading-snug mb-2">
                            ${art.title}
                        </h3>

                        <p class="text-xs text-slate-500 font-medium mb-4 flex items-center gap-1.5">
                            <i class="fa-solid fa-book-open text-slate-400"></i> ${art.journal} &bull; PMID: ${art.pmid}
                        </p>

                        <div class="bg-gradient-to-r from-amber-50 to-orange-50/50 border-l-4 border-amber-500 p-3.5 rounded-r-xl text-xs text-slate-700 mb-5">
                            <strong class="text-amber-900 font-bold block mb-1 flex items-center gap-1">
                                <i class="fa-solid fa-lightbulb text-amber-600"></i> Saha & Klinik Hap Bilgi:
                            </strong>
                            ${art.insight}
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                        <button onclick='openModal(${JSON.stringify(art).replace(/'/g, "&apos;")})' class="text-xs font-semibold text-slate-600 hover:text-[#0b1f3f] transition flex items-center gap-1">
                            <i class="fa-solid fa-align-left text-slate-400"></i> Detay & Abstract
                        </button>
                        <a href="${art.link}" target="_blank" class="text-xs font-bold text-[#e31b23] hover:text-red-700 transition flex items-center gap-1">
                            <span>PubMed'de Oku</span>
                            <i class="fa-solid fa-arrow-right text-[10px]"></i>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(cat) {
            currentCategory = cat;
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-[#0b1f3f]', 'text-white', 'shadow-sm');
                btn.classList.add('text-slate-600', 'border', 'border-slate-200');
            });

            event.currentTarget.classList.remove('text-slate-600', 'border', 'border-slate-200');
            event.currentTarget.classList.add('bg-[#0b1f3f]', 'text-white', 'shadow-sm');

            filterArticles();
        }

        function filterArticles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = articlesData.filter(art => {
                const matchesCat = (currentCategory === 'ALL' || art.category === currentCategory);
                const matchesSearch = art.title.toLowerCase().includes(query) || 
                                      art.insight.toLowerCase().includes(query) || 
                                      art.badgeText.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderArticles(filtered);
        }

        function openModal(art) {
            document.getElementById('modalTitle').innerText = art.title;
            document.getElementById('modalMeta').innerText = `${art.journal} | ${art.date} (PMID: ${art.pmid})`;
            document.getElementById('modalInsight').innerText = art.insight;
            document.getElementById('modalAbstract').innerText = art.abstract;
            document.getElementById('modalLink').href = art.link;

            const badge = document.getElementById('modalBadge');
            badge.innerText = art.badgeText;
            badge.className = `text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md mb-2 inline-block border ${art.badgeClass}`;

            document.getElementById('articleModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('articleModal').classList.add('hidden');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('articleModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderArticles(articlesData);
        });
    </script>
