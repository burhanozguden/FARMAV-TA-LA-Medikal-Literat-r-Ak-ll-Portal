name: Günlük PubMed Senkronizasyonu

on:
  schedule:
    - cron: '0 6 * * *' # Her sabah saat 06:00'da otomatik çalışır
  workflow_dispatch: # İstersen GitHub panelinden tek tıkla manuel tetikleyebilirsin

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repo'yu Kopyala
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install requests

      - name: Python Scriptini Çalıştır
        run: python script.py

      - name: Değişiklikleri GitHub'a Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Günlük PubMed makaleleri güncellendi [skip ci]" && git push)
